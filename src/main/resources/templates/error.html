<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Error')}"></head>
<body>
<header th:replace="~{layout :: navbar}"></header>
<main id="main" class="container py-5 text-center">
    <div class="error-code" aria-hidden="true">Oops</div>
    <h1 class="h2 mt-2">Something went wrong</h1>
    <p class="lead text-muted-ems mb-4">An unexpected error occurred. Please try again.</p>
    <a class="btn btn-primary btn-lg" th:href="@{/}">Back to home</a>
</main>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
