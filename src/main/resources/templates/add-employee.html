<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>Add Employee</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/save}"
                  th:object="${employee}"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Name
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{name}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{department}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Salary
                    </label>

                    <input type="number"
                           class="form-control"
                           th:field="*{salary}"
                           required>

                </div>

                <button type="submit"
                        class="btn btn-success">

                    Save Employee

                </button>

                <a href="/"
                   class="btn btn-secondary">

                    Back

                </a>

            </form>

        </div>

    </div>

</div>

<script th:src="@{/js/app.js}"></script>

</body>

</html>
