<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Add Employee')}"></head>
<body>
<header th:replace="~{layout :: navbar}"></header>
<main id="main">
    <div class="page-header on-dark">
        <div class="container">
            <h1 class="h2 mb-1">Add Employee</h1>
            <p class="mb-0">Create a new employee record.</p>
        </div>
    </div>
    <div class="container page-body">
        <form th:action="@{/save}" th:object="${employee}" method="post"
              class="panel panel-pad p-md-4" style="max-width: 42rem;">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label for="department" class="form-label">Department</label>
                <input type="text" class="form-control" id="department" th:field="*{department}">
            </div>
            <div class="mb-4">
                <label for="salary" class="form-label">Salary</label>
                <input type="number" step="0.01" min="0" class="form-control" id="salary" th:field="*{salary}">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Add employee</button>
                <a class="btn btn-outline-primary" th:href="@{/dashboard}">Cancel</a>
            </div>
        </form>
    </div>
</main>
<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
