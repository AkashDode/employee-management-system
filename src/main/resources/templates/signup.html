<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign Up')}"></head>
<body>
<header th:replace="~{layout :: navbar}"></header>
<main id="main" class="auth-wrap">
    <aside class="auth-aside on-dark" aria-hidden="true">
        <h2 class="mb-3">Join Employee Management System</h2>
        <p class="mb-4">Create your account and start exploring your team directory.</p>
        <ul class="list-unstyled mb-0">
            <li class="mb-2">&#10003; Free to get started</li>
            <li class="mb-2">&#10003; Passwords are securely hashed</li>
            <li>&#10003; Your data stays protected</li>
        </ul>
    </aside>
    <div class="auth-main">
        <div class="auth-card">
            <h1 class="h3 mb-1">Create your account</h1>
            <p class="text-muted-ems mb-4">It only takes a minute.</p>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/signup}" th:object="${user}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">Create Account</button>
            </form>
            <p class="mt-4 mb-0 text-center">Already registered? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</main>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
