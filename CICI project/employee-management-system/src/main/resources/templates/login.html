<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Login')}"></head>
<body>
<header th:replace="~{layout :: navbar}"></header>

<main id="main" class="container">
    <div class="card auth-card p-4 p-md-5">
        <h1 class="h3 mb-4">Log in to your account</h1>
        <div class="alert alert-danger" role="alert" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="alert alert-info" role="status" th:if="${param.logout}">
            You have been logged out.
        </div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                           autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary password-toggle" type="button"
                            data-password-toggle="password" aria-controls="password"
                            aria-label="Show password" title="Show password" aria-pressed="false">
                        <svg data-password-icon="show" aria-hidden="true" focusable="false"
                             width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg data-password-icon="hide" aria-hidden="true" focusable="false" hidden
                             width="20" height="20" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10.7 10.7 0 0 1 22 12s-2 4-5.3 6.1M6.6 6.6A10.9 10.9 0 0 0 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.8-.8"/>
                        </svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-4 mb-0 text-center">New here? <a th:href="@{/signup}">Create an account</a></p>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
